@if (produto; as item) {
<section class="space-y-6">
    <div class="breadcrumbs text-sm">
        <ul>
            <li><a routerLink="/produtos">Produtos</a></li>
            <li>{{ item.nome }}</li>
        </ul>
    </div>

    <div class="card card-border bg-base-200 shadow-sm">
        <div class="card-body gap-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                    <p class="text-sm uppercase tracking-[0.2em] text-base-content/70">Produto #{{ item.id }}</p>
                    <h1 class="card-title text-3xl">{{ item.nome }}</h1>
                </div>

                <a class="btn btn-outline btn-primary" routerLink="/produtos">Voltar</a>
            </div>

            <div class="divider my-0"></div>

            <p class="text-base leading-7 text-base-content/85">{{ item.descricao }}</p>
        </div>
    </div>
</section>
} @else {
<div role="alert" class="alert alert-warning">
    <span>Produto não encontrado.</span>
</div>
}
